# Nginx di dalam stack HRD. Satu-satunya container stack ini yang tersambung
# ke network 'web', sehingga proxy_nginx di depan hanya perlu mengenal nama
# 'hrd_nginx' — backend, database, dan Redis tetap tidak terjangkau dari luar.

# Resolver internal Docker. Upstream ditulis lewat variabel supaya nama
# container diselesaikan saat ada request, bukan saat nginx start: kalau
# frontend/backend belum siap, nginx tetap boot dan tidak ikut mati.
resolver 127.0.0.11 valid=30s;

# Connection: upgrade hanya boleh dikirim saat klien memang meminta upgrade.
# Mengirimnya tanpa syarat merusak keep-alive pada request biasa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# X-Forwarded-For diteruskan apa adanya, tidak ditambahi: proxy_nginx di depan
# sudah mengisinya dengan tepat satu entri berisi IP asli pengunjung. Menambah
# entri di sini akan membuat jumlah lapis berbeda antara jalur web (lewat Next)
# dan jalur aplikasi Android (langsung ke backend), sehingga TRUST_PROXY_HOPS
# tidak bisa benar untuk keduanya sekaligus.
server {
    listen 80;
    server_name _;

    # Dokumen karyawan dikirim base64 di dalam body JSON, dan foto presensi
    # bisa sampai 8 MB. 25M memberi kelonggaran di atas keduanya.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Jangan bocorkan versi nginx di header respons.
    server_tokens off;

    # --- Aset statis Next ---
    # Berkas di /_next/static punya hash di namanya, jadi aman di-cache lama.
    location /_next/static/ {
        set $up_frontend frontend:3001;
        proxy_pass http://$up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- BFF milik Next ---
    # HARUS berada di atas /api/ secara prefix: nginx memilih prefix terpanjang,
    # jadi /api/backend/* tetap masuk ke Next walau /api/ diarahkan ke backend.
    # Di sinilah token JWT dari cookie httpOnly ditempelkan, sehingga browser
    # tidak pernah memegang tokennya.
    location /api/backend/ {
        set $up_frontend frontend:3001;
        proxy_pass http://$up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Unduhan APK dan ekspor laporan bisa berjalan lama; jangan diputus.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # Respons diteruskan apa adanya supaya unduhan tidak ditahan di memori.
        proxy_buffering off;
    }

    # --- API langsung untuk aplikasi Android ---
    # Aplikasi Flutter memanggil backend langsung (dibangun dengan
    # --dart-define=API_URL=https://hrd.nbp.co.id/api), bukan lewat BFF Next.
    location /api/ {
        set $up_backend backend:3000;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Endpoint kesehatan backend, untuk pemantauan dari luar. Tidak memuat
    # data aplikasi, hanya status koneksi database dan Redis.
    location = /health {
        set $up_backend backend:3000;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Sisanya: halaman web Next ---
    location / {
        set $up_frontend frontend:3001;
        proxy_pass http://$up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
