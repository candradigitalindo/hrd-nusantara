# Stack pengembangan lengkap: PostgreSQL + Redis + backend API.
# Salin .env.docker.example menjadi .env lalu jalankan: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-hrd_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-hrd_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrd-redis
    restart: unless-stopped
    # Redis menyimpan sesi dan cache, jadi datanya dipersistenkan.
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hrd-backend
    restart: unless-stopped
    # Backend menunggu database benar-benar siap menerima koneksi,
    # bukan sekadar containernya sudah jalan.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrd_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi, minimal 32 karakter}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      ATTENDANCE_LATE_TOLERANCE_MINUTES: ${ATTENDANCE_LATE_TOLERANCE_MINUTES:-5}
      ATTENDANCE_MIN_OVERTIME_MINUTES: ${ATTENDANCE_MIN_OVERTIME_MINUTES:-30}
      ATTENDANCE_MAX_SHIFT_HOURS: ${ATTENDANCE_MAX_SHIFT_HOURS:-16}
      FACE_MODEL_DIR: /app/models/${FACE_MODEL_PACK:-buffalo_s}
      FACE_MODEL_NAME: ${FACE_MODEL_PACK:-buffalo_s}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.45}
      FACE_RECOGNITION_ENABLED: ${FACE_RECOGNITION_ENABLED:-true}
      FACE_STORE_CHECKIN_IMAGES: ${FACE_STORE_CHECKIN_IMAGES:-false}
      UPLOAD_DIR: /app/uploads
      FACE_ANTISPOOF_MODEL: /app/models/antispoof/minifasnet_v2.onnx
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-0.6}
      FACE_LIVENESS_ENABLED: ${FACE_LIVENESS_ENABLED:-true}
    volumes:
      # Foto pendaftaran wajah harus tetap ada walau container dibuat ulang.
      - faceuploads:/app/uploads
    ports:
      - '${BACKEND_PORT:-3000}:3000'

volumes:
  pgdata:
  redisdata:
  faceuploads:
